name: Deploy storefront to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build project
        run: npm run build
        working-directory: frontend
        env:
          # set this repository variable to your hosted backend URL (Settings > Secrets and variables > Actions > Variables)
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # GitHub Pages has no server-side routing: this makes /shopping-cart/verify, /cart etc. work on refresh
      # (and when Stripe sends the customer back to /verify)
      - name: SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
